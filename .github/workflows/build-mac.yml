name: Build Mac apps

# Started by release/publish.py for each release. The app's source is kept
# encrypted (source.enc on a draft release that's never public); only this
# build can unlock it, with the SOURCE_KEY secret. The finished apps are
# attached to the release as buchhop-reinvest-macos-arm64.zip and
# buchhop-reinvest-macos-x64.zip - publish.py then signs them so the Mac
# apps' updater will install them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach the Mac apps to (e.g. build-1790697021)"
        required: true
      source:
        description: "Draft release holding source.enc"
        required: true
        default: "mac-build-source"

permissions:
  contents: write

concurrency:
  group: build-mac
  cancel-in-progress: false

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest      # an Apple Silicon Mac
          - arch: x64
            os: macos-15-intel    # an Intel Mac
    runs-on: ${{ matrix.os }}
    env:
      WANT: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
      BUCHHOP_TARGET_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      # Each app is built on a Mac with that chip, in a clean environment so
      # nothing built for the other chip gets in.
      - name: Python for this chip
        run: |
          PY="$(python -c 'import sys; print(sys.executable)')"
          echo "base Python: $PY ($("$PY" -c 'import platform; print(platform.machine())'))"
          test "$("$PY" -c 'import platform; print(platform.machine())')" = "$WANT"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          test "$("$PY" -c 'import platform; print(platform.machine())')" = "$WANT"
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Unlock the source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
        run: |
          $PY -m pip install --quiet cryptography
          gh release download "${{ inputs.source }}" -R "${{ github.repository }}" -p source.enc -D .
          $PY - <<'EOF'
          import base64, io, os, tarfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob = open("source.enc", "rb").read()
          assert blob[:6] == b"BRSRC1", "not a Buchhop Reinvest source file"
          key = base64.b64decode(os.environ["SOURCE_KEY"])
          data = AESGCM(key).decrypt(blob[6:18], blob[18:], b"buchhop-reinvest-src")
          tarfile.open(fileobj=io.BytesIO(data), mode="r:gz").extractall("app", filter="data")
          print("source unlocked")
          EOF
          rm -f source.enc

      # cryptography only from a ready-made build: one compiled here links to
      # Homebrew's OpenSSL, which the bundled app can't load.
      - name: Install
        working-directory: app
        run: |
          $PY -m pip install --quiet --upgrade pip
          $PY -m pip install --quiet --only-binary cryptography -r requirements.txt pyinstaller pillow
          $PY -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Build
        working-directory: app
        run: $PY build.py --keep-stamp

      - name: Check the app starts
        working-directory: app
        run: '"dist/Buchhop Reinvest.app/Contents/MacOS/Buchhop Reinvest" --self-test'

      - name: Zip and attach to the release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got="$(lipo -archs "dist/Buchhop Reinvest.app/Contents/MacOS/Buchhop Reinvest")"
          echo "app binary is: $got (want $WANT)"
          test "$got" = "$WANT"
          codesign --force --deep --sign - "dist/Buchhop Reinvest.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Buchhop Reinvest.app" "buchhop-reinvest-macos-${{ matrix.arch }}.zip"
          gh release upload "${{ inputs.tag }}" "buchhop-reinvest-macos-${{ matrix.arch }}.zip" --clobber -R "${{ github.repository }}"
